<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Dat Kit logo">
  <!-- Background: rounded square, deep indigo gradient -->
  <defs>
    <linearGradient id="dk-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="dk-mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="224" height="224" rx="48" fill="url(#dk-bg)"/>
  <!-- Spec document: angled sheet -->
  <g>
    <path d="M70 52 h74 l30 30 v106 a10 10 0 0 1 -10 10 H70 a10 10 0 0 1 -10 -10 V62 a10 10 0 0 1 10 -10 z"
          fill="#eef2ff" opacity="0.96"/>
    <path d="M144 52 l30 30 h-30 z" fill="#c7d2fe"/>
    <!-- spec lines -->
    <rect x="82" y="96"  width="88" height="10" rx="5" fill="#4f46e5" opacity="0.85"/>
    <rect x="82" y="118" width="72" height="10" rx="5" fill="#6366f1" opacity="0.65"/>
    <rect x="82" y="140" width="80" height="10" rx="5" fill="#6366f1" opacity="0.45"/>
    <rect x="82" y="162" width="56" height="10" rx="5" fill="#6366f1" opacity="0.30"/>
  </g>
  <!-- Checkmark node: signal that the spec is verified/executed -->
  <circle cx="164" cy="164" r="34" fill="url(#dk-mark)"/>
  <path d="M148 164 l11 11 l21 -22" fill="none" stroke="#1e1b4b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
